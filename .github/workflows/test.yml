name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run converter tests
        run: npm test
      - name: Install lint tooling
        run: npm install --no-audit --no-fund --no-save eslint@9
      - name: Lint
        run: npx eslint .
