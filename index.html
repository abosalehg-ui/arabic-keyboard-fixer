<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحح لوحة المفاتيح العربية | Arabic Keyboard Fixer</title>
    <meta name="description" content="تطبيق ويب يصحّح النص المكتوب بتخطيط لوحة مفاتيح خاطئ بين العربية والإنجليزية — يعمل بالكامل في المتصفح، بدون إرسال بيانات.">
    <meta name="keywords" content="عربي, لوحة مفاتيح, تحويل, Arabic, keyboard, fixer, qwerty, 101, 102">
    <meta name="theme-color" content="#1e1e2e" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#eef2f8" media="(prefers-color-scheme: light)">
    <meta property="og:type" content="website">
    <meta property="og:title" content="مصحح لوحة المفاتيح العربية">
    <meta property="og:description" content="تطبيق ويب يصحّح النص المكتوب بتخطيط لوحة مفاتيح خاطئ بين العربية والإنجليزية.">
    <meta property="og:locale" content="ar_AR">
    <meta property="og:url" content="https://abosalehg-ui.github.io/arabic-keyboard-fixer/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="مصحح لوحة المفاتيح العربية">
    <meta name="twitter:description" content="حوّل النص المكتوب بتخطيط لوحة مفاتيح خاطئ — عربي ↔ إنجليزي.">
    <link rel="canonical" href="https://abosalehg-ui.github.io/arabic-keyboard-fixer/">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🔧%3C/text%3E%3C/svg%3E">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Arabic Keyboard Fixer",
        "alternateName": "مصحح لوحة المفاتيح العربية",
        "applicationCategory": "UtilityApplication",
        "operatingSystem": "Any (Web)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "url": "https://abosalehg-ui.github.io/arabic-keyboard-fixer/"
    }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a href="#mainContent" class="skip-link" id="skipLink">تخطي إلى المحتوى الرئيسي</a>
    <main class="container" id="mainContent">
        <div class="header">
            <div class="header-actions">
                <button id="languageToggle" class="icon-btn lang-btn" type="button">English</button>
                <button id="swapDirection" class="icon-btn" type="button">⇄</button>
                <button id="themeToggle" class="icon-btn" type="button">🌙</button>
            </div>
            <h1><span id="headerTitle">🔧 مصحح لوحة المفاتيح العربية</span> <span class="status-indicator" aria-hidden="true"></span></h1>
            <p id="headerSubtitle">اكتب أو الصق النص المخلوط واحصل على الإصلاح الفوري</p>
        </div>

        <div class="input-section">
            <label for="textInput" id="inputLabel">أدخل النص المخلوط:</label>
            <textarea
                id="textInput"
                aria-describedby="charCountLabel shortcutsHint"
                aria-keyshortcuts="Control+Enter Control+L Control+Shift+C"
                spellcheck="false"
                autocomplete="off"
            ></textarea>
            <div class="char-count" id="charCountLabel">
                <span id="charCountLabelText">عدد الأحرف:</span> <span id="charCount">0</span>
            </div>
            <div class="shortcuts-hint" id="shortcutsHint"></div>
        </div>

        <div class="suggestions-section" role="region" aria-live="polite" id="suggestionsRegion">
            <div class="suggestions-title" id="suggestionsTitle">💡 الاقتراحات والإصلاحات</div>
            <div id="suggestionsContainer"></div>
        </div>

        <div class="keyboard-info" id="keyboardInfo"></div>

        <div class="history" id="historyRegion">
            <div class="history-header">
                <div class="history-title" id="historyTitle">📝 السجل</div>
                <div class="history-controls">
                    <button id="exportHistoryBtn" class="btn-secondary" type="button">⤓ تصدير</button>
                    <button id="clearHistoryBtn" class="btn-secondary" type="button">🗑️ مسح</button>
                </div>
            </div>
            <div id="historyContainer"></div>
        </div>

        <div class="footer">
            <p id="footerText">تطبيق مصحح لوحة المفاتيح العربية v1.1</p>
        </div>
    </main>

    <script src="js/app.js" defer></script>
</body>
</html>
