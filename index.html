<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>مصحح لوحة المفاتيح العربية | Arabic Keyboard Fixer</title>
    <meta name="description" content="تطبيق ويب يصحّح النص المكتوب بتخطيط لوحة مفاتيح خاطئ بين العربية والإنجليزية — يعمل بالكامل في المتصفح، بدون إرسال بيانات.">
    <meta name="keywords" content="عربي, لوحة مفاتيح, تحويل, Arabic, keyboard, fixer, qwerty, 101, 102">
    <meta name="theme-color" content="#1e1e2e" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#eef2f8" media="(prefers-color-scheme: light)">
    <meta property="og:type" content="website">
    <meta property="og:title" content="مصحح لوحة المفاتيح العربية">
    <meta property="og:description" content="تطبيق ويب يصحّح النص المكتوب بتخطيط لوحة مفاتيح خاطئ بين العربية والإنجليزية.">
    <meta property="og:locale" content="ar_AR">
    <meta property="og:url" content="https://abosalehg-ui.github.io/arabic-keyboard-fixer/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="مصحح لوحة المفاتيح العربية">
    <meta name="twitter:description" content="حوّل النص المكتوب بتخطيط لوحة مفاتيح خاطئ — عربي ↔ إنجليزي.">
    <link rel="canonical" href="https://abosalehg-ui.github.io/arabic-keyboard-fixer/">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🔧%3C/text%3E%3C/svg%3E">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Arabic Keyboard Fixer",
        "alternateName": "مصحح لوحة المفاتيح العربية",
        "applicationCategory": "UtilityApplication",
        "operatingSystem": "Any (Web)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "url": "https://abosalehg-ui.github.io/arabic-keyboard-fixer/"
    }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a href="#mainContent" class="skip-link" id="skipLink" data-i18n="buttons.skipToMain">تخطي إلى المحتوى الرئيسي</a>
    <main class="container" id="mainContent">
        <div class="header">
            <div class="header-actions">
                <button id="languageToggle" class="icon-btn lang-btn" type="button"
                        data-i18n="buttons.language" data-i18n-aria="buttons.language">English</button>
                <button id="swapDirection" class="icon-btn" type="button"
                        data-i18n-aria="aria.swap" data-i18n-title="buttons.swap">
                    <span aria-hidden="true">⇄</span>
                </button>
                <button id="themeToggle" class="icon-btn" type="button" data-i18n-title="buttons.theme">🌙</button>
            </div>
            <h1><span id="headerTitle" data-i18n="title">🔧 مصحح لوحة المفاتيح العربية</span> <span class="status-indicator" aria-hidden="true"></span></h1>
            <p id="headerSubtitle" data-i18n="subtitle">اكتب أو الصق النص المخلوط واحصل على الإصلاح الفوري</p>
        </div>

        <div class="input-section">
            <label for="textInput" id="inputLabel" data-i18n="labels.input">أدخل النص المخلوط:</label>
            <textarea
                id="textInput"
                dir="auto"
                aria-describedby="charCountLabel shortcutsHint"
                aria-keyshortcuts="Control+Enter Alt+K Alt+C"
                spellcheck="false"
                autocomplete="off"
                data-i18n-placeholder="placeholder.input"
            ></textarea>
            <div class="char-count" id="charCountLabel">
                <span id="charCountLabelText" data-i18n="labels.charCount">عدد الأحرف:</span> <span id="charCount">0</span>
            </div>
            <p class="length-warning" id="lengthWarning" role="alert" hidden></p>
            <div class="shortcuts-hint" id="shortcutsHint"></div>
        </div>

        <div class="suggestions-section" role="region" id="suggestionsRegion" data-i18n-aria="aria.suggestions">
            <div class="suggestions-title" id="suggestionsTitle" data-i18n="labels.suggestions">💡 الاقتراحات والإصلاحات</div>
            <div id="suggestionsContainer"></div>
        </div>

        <div class="keyboard-info" id="keyboardInfo"></div>

        <div class="history" role="region" id="historyRegion" data-i18n-aria="aria.history">
            <div class="history-header">
                <div class="history-title" id="historyTitle" data-i18n="labels.history">📝 السجل</div>
                <div class="history-controls">
                    <label class="history-switch">
                        <input type="checkbox" id="historyToggle">
                        <span data-i18n="labels.historyToggle">حفظ السجل</span>
                    </label>
                    <button id="exportHistoryBtn" class="btn-secondary" type="button"
                            data-i18n="buttons.export" data-i18n-aria="aria.export">⤓ تصدير</button>
                    <button id="clearHistoryBtn" class="btn-secondary" type="button"
                            data-i18n="buttons.clear" data-i18n-aria="aria.clear">🗑️ مسح</button>
                </div>
            </div>
            <p class="history-notice" id="historyNotice" data-i18n="labels.historyNotice">
                السجل مُعطَّل. لا يُحفظ أي نص تكتبه هنا.
            </p>
            <button id="purgeStoredBtn" class="btn-secondary purge-btn" type="button"
                    data-i18n="buttons.purgeStored" hidden>🧹 حذف البيانات المحفوظة سابقًا</button>
            <div id="historyList" hidden>
                <div id="historyContainer"></div>
            </div>
        </div>

        <div class="footer">
            <p id="footerText" data-i18n="labels.footer">تطبيق مصحح لوحة المفاتيح العربية v1.2</p>
        </div>

        <div id="srStatus" class="sr-only" role="status" aria-live="polite"></div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
